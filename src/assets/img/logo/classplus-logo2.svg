<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1C3B6E;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Clipping -->
  <clipPath id="circleClip">
    <circle cx="200" cy="150" r="135"/>
  </clipPath>
  
  <rect 
    width="400" 
    height="300" 
    fill="url(#bgGradient)" 
    clip-path="url(#circleClip)"/>
  
  <!-- Graduation Cap with Subtle Movement -->
  <path 
    d="M200 80 L320 140 L200 200 L80 140 Z" 
    fill="#1C3B6E" 
    stroke="#152D54" 
    stroke-width="3"
    clip-path="url(#circleClip)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="-2 200 140" 
      to="2 200 140" 
      dur="3s" 
      repeatCount="indefinite"/>
  </path>
  
  <!-- Digital Grid -->
  <g 
    stroke="#4A90E2" 
    stroke-width="1" 
    stroke-opacity="0.6" 
    clip-path="url(#circleClip)">
    <path d="M130 120 L270 120 M130 150 L270 150 M130 180 L270 180" fill="none"/>
    <path d="M150 100 L150 200 M200 100 L200 200 M250 100 L250 200" fill="none"/>
  </g>
  
  <!-- Data Points -->
  <g fill="#FFFFFF" clip-path="url(#circleClip)">
    <circle cx="150" cy="120" r="4"/>
    <circle cx="200" cy="150" r="4"/>
    <circle cx="250" cy="180" r="4"/>
  </g>
  
  <!-- Animated Border Circle -->
  <circle cx="200" cy="150" r="135" fill="none" stroke="#204378" stroke-width="5" stroke-dasharray="850" stroke-dashoffset="0">
    <animate 
      attributeName="stroke-dashoffset" 
      from="850" 
      to="0" 
      dur="4s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- ClassPlus Text with Cap Movement Sync -->
  <text 
    x="200" 
    y="250" 
    text-anchor="middle" 
    font-family="Arial, sans-serif" 
    font-size="40" 
    font-weight="bold" 
    fill="#1C3B6E"
    clip-path="url(#circleClip)">
    <animate 
      attributeName="transform" 
      type="rotate" 
      from="-1 200 250" 
      to="1 200 250" 
      dur="3s" 
      repeatCount="indefinite"/>
    ClassPlus
  </text>
  
  <!-- Tassel with Synchronized Movement -->
  <path 
    d="M200 200 L200 240" 
    stroke="#4A90E2" 
    stroke-width="3"
    clip-path="url(#circleClip)"/>
  <path 
    d="M200 240 Q215 255 200 270 Q185 255 200 240" 
    fill="#4A90E2"
    clip-path="url(#circleClip)">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="-2 200 240" 
      to="2 200 240" 
      dur="3s" 
      repeatCount="indefinite"/>
  </path>
</svg>
